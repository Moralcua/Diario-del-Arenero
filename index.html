function paintChips(root, d){
  root.querySelectorAll('.chip[data-tag]').forEach(function(c){
    var id = c.dataset.tag, t = tagById(id), v = d.tags[id], on = v != null && v > 0;
    c.setAttribute('aria-pressed', on ? 'true' : 'false');
    var b = c.querySelector('.count');
    if (b) b.textContent = !on ? '' : (t && t.unit ? amtLabel(t, v) : (v > 1 ? '×' + v : '1'));
  });
}
function bindChips(root, d, after){
  root.querySelectorAll('.chip[data-tag]').forEach(function(c){
    c.onclick = function(ev){
      var id = c.dataset.tag, t = tagById(id), cur = d.tags[id];
      var onBadge = !!(ev.target.closest && ev.target.closest('.count'));
      if (isMeasure(t)){
        if (cur != null && !onBadge){ delete d.tags[id]; paintChips(root, d); after(); return; }
        openQty(t, cur, function(n){ d.tags[id] = n; paintChips(root, d); after(); });
        return;
      }
      if (t && t.unit){
        if (cur != null && onBadge){
          openQty(t, cur, function(n){ d.tags[id] = n; paintChips(root, d); after(); });
          return;
        }
        if (cur != null) delete d.tags[id]; else d.tags[id] = Number(t.qty) || 1;
      } else {
        if (onBadge && cur > 0) d.tags[id] = cur >= 9 ? 1 : cur + 1;
        else if (cur > 0) delete d.tags[id];
        else d.tags[id] = 1;
      }
      if (t && kindOf(t.kind).duration && d.tags[id] != null && d.mode !== 'range'){
        d.mode = 'range';
        if (!d.tsEnd || d.tsEnd - d.ts < 5*60000){ d.tsEnd = new Date(); d.ts = new Date(d.tsEnd.getTime() - 3600000); }
        paintTime(root, d);
        toast('Marca desde cuándo y hasta cuándo');
      } else {
        var dn = root.querySelector('[data-durnote]'); if (dn) dn.textContent = rangeNote(d);
      }
      paintChips(root, d); after();
    };
  });
}

function presetsFor(d){
  var now = new Date(), out = [], list = entriesOf(d.tracker), last = null;
  for (var i = list.length - 1; i >= 0; i--){ if (list[i].id !== d.id){ last = list[i]; break; } }
  if (last){
    var from = new Date(entryEnd(last));
    if (from < now) out.push({ label:'Desde el último (' + agoShort(now - from) + ')', a:from, b:now });
  }
  out.push({ label:'Últimas 2 h', a:new Date(now - 2*3600000), b:now });
  out.push({ label:'Últimas 4 h', a:new Date(now - 4*3600000), b:now });
  var a = new Date(now); a.setDate(a.getDate() - 1); a.setHours(23,0,0,0);
  var b = new Date(now); b.setHours(8,0,0,0); if (b > now) b = new Date(now);
  if (b > a) out.push({ label: now.getHours() < 12 ? 'Esta noche' : 'Anoche', a:a, b:b });
  out.push({ label:'Hasta ahora', a:null, b:now });
  return out;
}
function rangeNote(d){
  if (d.mode !== 'range') return '';
  if (!d.tsEnd || d.tsEnd - d.ts < 60000) return 'La hora «hasta» tiene que ser al menos un minuto posterior a «desde».';
  var ms = d.tsEnd - d.ts;
  var dur = Object.keys(d.tags).some(function(id){ var t = tagById(id); return t && kindOf(t.kind).duration; });
  return dur ? 'Duración: ' + fmtDur(ms) + '.' : 'Cuenta como una sola vez, en algún momento de estas ' + fmtDur(ms) + '.';
}
function timeHTML(d){
  var h = '<div class="timebar"><div class="modeseg">' +
    '<button data-mode="point" aria-pressed="'+(d.mode === 'point')+'">Hora</button>' +
    '<button data-mode="range" aria-pressed="'+(d.mode === 'range')+'">Franja</button></div>';
  if (d.mode === 'point'){
    h += '<input type="datetime-local" data-dt="ts" value="'+toLocalInput(d.ts)+'" aria-label="Fecha y hora">' +
         '<div class="nudge"><button data-nudge="0" class="now">Ahora</button><button data-nudge="-15">−15 min</button><button data-nudge="-60">−1 h</button></div>';
  } else {
    h += '<div class="rangebox"><label>Desde</label><input type="datetime-local" data-dt="ts" value="'+toLocalInput(d.ts)+'">' +
         '<label>Hasta</label><input type="datetime-local" data-dt="tsEnd" value="'+toLocalInput(d.tsEnd || new Date())+'"></div>' +
         '<div class="presets">' + presetsFor(d).map(function(p, i){ return '<button data-preset="'+i+'">'+esc(p.label)+'</button>'; }).join('') + '</div>' +
         '<p class="durnote" data-durnote>'+esc(rangeNote(d))+'</p>';
  }
  return h + '</div>';
}
function paintTime(root, d){
  var box = root.querySelector('[data-time]');
  if (!box) return;
  box.innerHTML = timeHTML(d);
  var ps = presetsFor(d);
  box.querySelectorAll('[data-mode]').forEach(function(b){
    b.onclick = function(){
      d.mode = b.dataset.mode;
      if (d.mode === 'range' && (!d.tsEnd || d.tsEnd - d.ts < 5*60000)){
        d.tsEnd = new Date(Math.max(Date.now(), d.ts.getTime()));
        if (d.tsEnd - d.ts < 5*60000) d.ts = new Date(d.tsEnd.getTime() - 3600000);
      }
      paintTime(root, d);
    };
  });
  box.querySelectorAll('[data-dt]').forEach(function(inp){
    inp.addEventListener('change', function(){
      var v = fromLocalInput(inp.value);
      if (v){ d[inp.dataset.dt] = v; var n = box.querySelector('[data-durnote]'); if (n) n.textContent = rangeNote(d); }
    });
  });
  box.querySelectorAll('[data-nudge]').forEach(function(b){
    b.onclick = function(){
      var m = +b.dataset.nudge;
      d.ts = m === 0 ? new Date() : new Date(d.ts.getTime() + m*60000);
      box.querySelector('[data-dt="ts"]').value = toLocalInput(d.ts);
    };
  });
  box.querySelectorAll('[data-preset]').forEach(function(b){
    b.onclick = function(){
      var p = ps[+b.dataset.preset];
      if (p.a) d.ts = new Date(p.a);
      d.tsEnd = new Date(p.b);
      if (d.ts >= d.tsEnd) d.ts = new Date(d.tsEnd.getTime() - 3600000);
      paintTime(root, d);
    };
  });
}

/* ============ resumen de hoy ============ */
function latest(list){
  var best = null;
  list.forEach(function(e){ if (!best || entryEnd(e) > entryEnd(best)) best = e; });
  return best;
}
function summaryLine(tr, list){
  var a = agg(list), parts = [];
  if (tr === 'arenero'){
    if (!a.n) return 'Sin visitas';
    parts.push(plural(a.n, 'visita', 'visitas'));
    if (a.kinds.orina) parts.push(a.kinds.orina + ' pipí');
    if (a.kinds.caca) parts.push(plural(a.kinds.caca, 'caca', 'cacas'));
    if (a.kinds.intento) parts.push(plural(a.kinds.intento, 'intento', 'intentos'));
  } else if (tr === 'dieta'){
    if (!a.n) return 'Nada registrado';
    Object.keys(a.units).forEach(function(u){ parts.push(fmtAmt(a.units[u], u)); });
    var ds = dayStatus(list);
    if (ds) parts.push(statusText(ds));
    else if (a.kcal > 0) parts.push(fmtKcal(netKcal(a)) + (Object.keys(a.kcalMissing).length ? ' (incompleto)' : ''));
    if (a.kinds.vomito) parts.push(plural(a.kinds.vomito, 'vómito', 'vómitos') + vomitNote(a));
    if (a.weights.length) parts.push('pesa ' + fmtKg(a.weights[a.weights.length - 1].v) + ' kg');
    if (a.durMs) parts.push('vacío ' + fmtDur(a.durMs));
    if (!parts.length) parts.push(plural(a.n, 'registro', 'registros'));
  } else if (tr === 'asma'){
    if (!a.n) return 'Sin episodios';
    if (a.kinds.tos) parts.push(plural(a.kinds.tos, 'tos', 'toses'));
    if (a.kinds.jadeo) parts.push(plural(a.kinds.jadeo, 'jadeo', 'jadeos'));

function urinaryAlarm(list){
  var since = Date.now() - 24*3600000, tries = 0, confirmed = 0, pees = 0;
  list.forEach(function(e){
    if (entryEnd(e) < since) return;
    Object.keys(e.tags || {}).forEach(function(id){
      var t = tagById(id); if (!t) return;
      var nn = Number(e.tags[id]) || 1;
      if (t.kind === 'intento'){ tries += nn; if ((t.w || 0) >= 2) confirmed += nn; }
      if (t.kind === 'orina' && (t.w || 0) >= 1) pees += nn;
    });
  });
  if (!tries) return [];
  var alarm = (confirmed >= 2 || tries >= 3) && pees === 0;
  return [{
    t: 'Arenero, últimas 24 h: ' + plural(tries, 'intento', 'intentos') + ' sin resultado y ' +
       (pees === 1 ? '1 micción normal' : pees + ' micciones normales') + '.' +
       (alarm ? ' Un gato que lo intenta repetidamente y no orina puede tener una obstrucción urinaria, que es una urgencia veterinaria de horas. Llama hoy a tu veterinario.' : ''),
    warn: alarm, alarm: alarm
  }];
}
function lastWithKind(list, kind){
  var best = null;
  list.forEach(function(e){
    var has = Object.keys(e.tags || {}).some(function(id){ var t = tagById(id); return t && t.kind === kind; });
    if (has && (!best || entryEnd(e) > entryEnd(best))) best = e;
  });
  return best;
}
function obsFor(tr){
  var list = entriesOf(tr), out = [];
  if (!list.length) return out;
  var now = Date.now(), dm = daysOf(tr), today = dayKey(new Date());
  if (tr === 'arenero') out = out.concat(urinaryAlarm(list));
  out.push({ t: LASTW[tr] + ' ' + agoOf(latest(list)) + '.' });

  if (tr === 'arenero'){
    var lc = lastWithKind(list, 'caca');
    if (lc){
      var hrs = (now - entryEnd(lc)) / 3600000;
      out.push({ t:'Última caca ' + agoOf(lc) + '.' + (hrs > 48 ? ' Más de dos días sin registrar ninguna.' : ''), warn: hrs > 48 });
    }
  }
  if (tr === 'dieta'){
    var ws = weightsOf(list);
    if (ws.length){

      out.push({ t:'Último peso: ' + fmtKg(lw.v) + ' kg, ' + agoText(now - lw.t) + '.' });
      var target = lw.t - 30*86400000, ref = null;
      ws.forEach(function(w){
        if (w.t <= lw.t - 21*86400000 && w.t >= lw.t - 60*86400000 && (!ref || Math.abs(w.t - target) < Math.abs(ref.t - target))) ref = w;
      });
      if (ref){
        var diff = lw.v - ref.v, pct = diff / ref.v * 100, dd = Math.round((lw.t - ref.t) / 86400000);
        var down = pct <= -5;
        out.push({ t:'En ' + dd + ' días ha pasado de ' + fmtKg(ref.v) + ' a ' + fmtKg(lw.v) + ' kg (' + (diff >= 0 ? '+' : '−') +
                     fmtNum(Math.abs(Math.round(pct * 10) / 10)) + ' %).' +
                     (down ? ' Una bajada de más del 5 % en un mes conviene comentarla con el veterinario.' : ''), warn: down });
      }
      if (now - lw.t > 31*86400000) out.push({ t:'Hace más de un mes que no lo pesas.' });
    }
    var VL7 = vomitLinks(), vlist = list.filter(isVomit);
    if (vlist.length){

      } else if (lm.length){

      } else vt += ' No había comida registrada en la hora anterior.';

      vlist.forEach(function(v){ if (entryEnd(v) >= since24) n24 += (agg([v]).kinds.vomito || 1); });
      if (n24 >= 2) out.push({ t:'Ha vomitado ' + n24 + ' veces en las últimas 24 h. Varios vómitos seguidos conviene comentarlos con el veterinario.', warn:true });
      var v30k = {}; rangeKeys(30).forEach(function(k){ v30k[k] = 1; });
      var l30 = list.filter(function(e){ return v30k[e.fecha]; }), a30 = agg(l30);

        (a30.kcalLost ? '; ' + fmtKcal(a30.kcalLost) + ' estimadas perdidas' : '') + (a30.kcalRisk ? '; ' + fmtKcal(a30.kcalRisk) + ' de comidas previas en duda, sin estimar.' : '.') });
    }

    var tds = dayStatus(dm.get(today) || []);

    else if (tds && tds.st === 'ok')

    if (!tds && (at.kcal > 0 || foodDays.length >= 3)){
      var kt = 'Hoy lleva ' + fmtKcal(netKcal(at));

        var ks = 0; foodDays.forEach(function(k){ ks += netKcal(agg(dm.get(k))); });
        kt += '; la media de los días de las dos últimas semanas en que registraste comida es ' + fmtKcal(ks / foodDays.length);
      }

    }
    var k30 = {}; rangeKeys(30).forEach(function(k){ k30[k] = 1; });
    var miss = missingKcalNames(list.filter(function(e){ return k30[e.fecha]; }));
    if (miss.length) out.push({ t:'Faltan las kcal de ' + miss.join(', ') + ', así que las calorías se quedan cortas. Añádelas en Ajustes → Etiquetas → Dieta (vienen en el envase).' });
    if (at.durMs) out.push({ t:'Hoy el comedero ha estado vacío ' + fmtDur(at.durMs) + ' (lo que has visto).' });
    var worst = null;
    list.forEach(function(e){ if (k30[e.fecha] && isDurEntry(e) && isRange(e) && (!worst || entryEnd(e) - entryStart(e) > entryEnd(worst) - entryStart(worst))) worst = e; });
    if (worst) out.push({ t:'El comedero vacío más largo de los últimos 30 días: ' + fmtDur(entryEnd(worst) - entryStart(worst)) + ', ' + (function(dl){ return (dl === 'Hoy' || dl === 'Ayer') ? dl.toLowerCase() : 'el ' + dl.toLowerCase(); })(dayLabel(worst.fecha)) + '.' });
  }
  if (tr === 'asma'){
    var first = list[0].fecha, win = rangeKeys(14).filter(function(k){ return k >= first; });
    if (win.length >= 3){
      var free = win.filter(function(k){ return !(dm.get(k) || []).length; }).length;
      out.push({ t:'En los últimos ' + win.length + ' días, ' + free + ' sin ningún episodio.' });
    }
  }
  if (tr === 'medicacion'){
    var MLx = medLinks();
    doubtfulRecent().forEach(function(m){
      out.push({ t:'Toma dudosa: ' + medDesc(m) + ', ' + afterText(m, MLx.byMed[m.id][0]) + '. Puede no haberla absorbido; consulta a tu veterinario si hay que repetirla.', warn:true });
    });
    tagsOf('medicacion').forEach(function(t){
      var best = null;
      list.forEach(function(e){ if (e.tags && e.tags[t.id] && (!best || entryEnd(e) > entryEnd(best))) best = e; });
      if (best) out.push({ t: t.label + ': última toma ' + agoOf(best) + (MLx.byMed[best.id] ? ' (dudosa por un vómito)' : '') + '.' });
    });
    var m30 = {}; rangeKeys(30).forEach(function(k){ m30[k] = 1; });
    var nd30 = list.filter(function(e){ return m30[e.fecha] && MLx.byMed[e.id]; }).length;
    if (nd30) out.push({ t:'En los últimos 30 días: ' + plural(nd30, 'toma dudosa', 'tomas dudosas') + ' por un vómito en las 2 horas siguientes.' });
  }
  if (tr !== 'medicacion' && tr !== 'dieta'){
    var fk = list[0].fecha, prev = rangeKeys(15).slice(0, 14).filter(function(k){ return k >= fk; });
    if (prev.length >= 5){
      var sum = 0; prev.forEach(function(k){ sum += (dm.get(k) || []).length; });

}

function dailyRows(tr, keys){

  }

  if (tr === 'medicacion'){

    return keys.map(function(k){
      var list = dm.get(k) || [];
      var fa = agg(list.filter(function(e){ return !BM[e.id]; })), da = agg(list.filter(function(e){ return BM[e.id]; }));
      return { k:k, vomit: da.n > 0, segs: kinds.map(function(kd){ return { v:fa.kinds[kd] || 0, kind:kd }; })
        .concat(kinds.map(function(kd){ return { v:da.kinds[kd] || 0, kind:kd, pale:true }; })) };
    });

function kcalRows(keys, foods){

    var lost = Math.min(okA.kcalLost + rkA.kcalLost, okA.kcal);   // lo estimado se descuenta de lo ya resuelto

function walkHours(a, b, fn){

function segColor(s, tr){ if (s.pal) return isDark() ? s.pal[1] : s.pal[0]; return s.kind === '_t' ? (isDark() ? trackerById(tr).c[1] : trackerById(tr).c[0]) : kcolor(s.kind); }
function barsSVG(rows, tr, o){
  o = o || {};

  var gap = n > 45 ? 0.6 : (n > 20 ? 1.2 : (n > 10 ? 2.4 : 6)), bw = (W - gap * (n - 1)) / n;
  var max = 0;
  rows.forEach(function(r){ var s = 0; r.segs.forEach(function(g){ s += g.v; }); if (s > max) max = s; });
  if (!max) max = 1;
  if (o.limit) max = Math.max(max, o.limit * 1.08);
  var s = '<svg viewBox="0 0 '+W+' '+(H+16)+'" role="img" aria-label="'+esc(o.label || '')+'">';
  s += '<line x1="0" y1="'+H+'" x2="'+W+'" y2="'+H+'" stroke="var(--line)"/>';
  rows.forEach(function(r, i){
    var x = i * (bw + gap), y = H, any = false;

  });
  if (o.limit){
    var ly = (H - o.limit / max * (H - 8)).toFixed(2);

         '<text x="'+W+'" y="'+(ly - 3)+'" font-size="8.5" fill="var(--warn)" text-anchor="end">límite '+o.limit+'</text>';
    rows.forEach(function(r, i){
      if (!r.over) return;
      var tot = 0; r.segs.forEach(function(g2){ tot += g2.v; });
      s += '<circle cx="'+(i*(bw+gap)+bw/2).toFixed(2)+'" cy="'+Math.max(3, H - tot / max * (H - 8) - 4).toFixed(2)+'" r="'+Math.max(1.4, Math.min(2.6, bw/2)).toFixed(2)+'" fill="var(--warn)"/>';
    });
  }
  rows.forEach(function(r, i){
    if (!r.vomit) return;
    var tot = 0; r.segs.forEach(function(g2){ tot += g2.v; });
    var cx = i*(bw+gap)+bw/2, top = H - tot / max * (H - 8) - (r.over && o.limit ? 10 : 4), hw = Math.max(1.8, Math.min(3, bw/2));

  });
  var step = o.every || Math.max(1, Math.ceil(n / 6));
  rows.forEach(function(r, i){
    if (i % step !== 0 && !(i === n - 1 && (n - 1) % step >= step / 2)) return;
    var lab = o.dates ? shortDate(r.k) : r.k;
    s += '<text x="'+(i*(bw+gap)+bw/2).toFixed(2)+'" y="'+(H+12)+'" font-size="8.5" fill="var(--ink-3)" text-anchor="middle">'+esc(lab)+'</text>';
  });
  s += '<text x="0" y="8" font-size="8.5" fill="var(--ink-3)">máx '+esc(fmtNum(Math.round(max*10)/10))+(o.unit ? ' '+esc(o.unit) : '')+'</text>';
  return s + '</svg>';
}
function medStripSVG(keys){

function weightGeom(ws, keys){
  var k0 = keys[0].split('-'), k1 = keys[keys.length - 1].split('-');
  var x0 = new Date(+k0[0], +k0[1]-1, +k0[2]).getTime();
  var x1 = new Date(+k1[0], +k1[1]-1, +k1[2]).getTime() + 86400000;
  var pts = ws.filter(function(w){ return w.t >= x0 && w.t < x1; });
  if (!pts.length) return null;
  var vs = pts.map(function(p){ return p.v; });
  var mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs);
  var pad = Math.max(0.05, (mx - mn) * 0.3);
  return { pts:pts, x0:x0, x1:x1, mn:mn, mx:mx, lo:mn - pad, hi:mx + pad };
}
function weightSVG(ws, keys){
  var g = weightGeom(ws, keys);
  if (!g) return null;
  var W = 320, H = 110, L = 34, R = 6, T = 8, B = 16;
  function X(t){ return L + (t - g.x0) / (g.x1 - g.x0) * (W - L - R); }
  function Y(v){ return T + (1 - (v - g.lo) / (g.hi - g.lo)) * (H - T - B); }
  var col = kcolor('peso');
  var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolución del peso">';
  [g.mn, g.mx].forEach(function(v, i){
    if (i && g.mx === g.mn) return;
    s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)" stroke-dasharray="3 3"/>' +
         '<text x="'+(L-4)+'" y="'+(Y(v)+3).toFixed(1)+'" font-size="8.5" fill="var(--ink-3)" text-anchor="end">'+fmtKg(v)+'</text>';
  });
  if (g.pts.length > 1) s += '<polyline fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="' +
    g.pts.map(function(p){ return X(p.t).toFixed(1) + ',' + Y(p.v).toFixed(1); }).join(' ') + '"/>';
  g.pts.forEach(function(p, i){
    var last = i === g.pts.length - 1;
    s += '<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(last ? 3.8 : 2.6)+'" fill="'+(last ? col : 'var(--surface)')+'" stroke="'+col+'" stroke-width="1.6"/>';
  });
  var lp = g.pts[g.pts.length - 1], lx = X(lp.t);
  s += '<text x="'+Math.min(lx, W - R - 2).toFixed(1)+'" y="'+Math.max(9, Y(lp.v) - 7).toFixed(1)+'" font-size="9" font-weight="700" fill="'+col+'" text-anchor="'+(lx > W - 40 ? 'end' : 'middle')+'">'+fmtKg(lp.v)+' kg</text>';
  [keys[0], keys[Math.floor(keys.length / 2)], keys[keys.length - 1]].forEach(function(k, i){
    var p = k.split('-'), t = new Date(+p[0], +p[1]-1, +p[2]).getTime() + 43200000;
    s += '<text x="'+X(t).toFixed(1)+'" y="'+(H-3)+'" font-size="8.5" fill="var(--ink-3)" text-anchor="'+(i === 0 ? 'start' : (i === 2 ? 'end' : 'middle'))+'">'+esc(shortDate(k))+'</text>';
  });
  return s + '</svg>';
}

function buildPdf(o){
  return loadJsPDF().then(function(JsPDF){
    var R = pdfRange(o);
    var set = {}; R.keys.forEach(function(k){ set[k] = 1; });

    sh.querySelectorAll('[data-ck]').forEach(function(inp){ inp.onchange = function(){ o[inp.dataset.ck] = inp.checked; }; });
    sh.querySelectorAll('[data-pt]').forEach(function(inp){ inp.onchange = function(){
      o.trackers = Array.prototype.slice.call(sh.querySelectorAll('[data-pt]')).filter(function(x){ return x.checked; }).map(function(x){ return x.dataset.pt; });
    }; });
    $('#pCancel').onclick = closeSheet;
    $('#pGo').onclick = function(){
      o.from = $('#pFrom').value; o.to = $('#pTo').value;
      if (o.period === -1 && (!o.from || !o.to)){ toast('Elige las dos fechas'); return; }
      if (!o.trackers.length){ toast('Elige al menos un seguimiento'); return; }
      closeSheet(); exportPdf(o);
    };
  });
}

/* ============ navegación y arranque ============ */
document.querySelectorAll('nav.tabs button').forEach(function(b){
  b.onclick = function(){ S.tab = b.dataset.tab; window.scrollTo(0,0); render(); };
});
$('#btnSettings').onclick = function(){ S.tab = S.tab === 'set' ? 'hoy' : 'set'; window.scrollTo(0,0); render(); };
$('#scrim2').addEventListener('click', function(e){ if (e.target === $('#scrim2')) closeSheet2(); });
$('#camInput').addEventListener('change', onPick($('#camInput')));
$('#galInput').addEventListener('change', onPick($('#galInput')));
$('#vidCamInput').addEventListener('change', onPick($('#vidCamInput')));

function bootApp(){
  return loadMeta().then(function(){ return idbGet('kv','config'); }).then(function(cfg){
    var c = cfg ? migrateConfig(cfg) : Object.assign(normConfig({ tags:defaultTags(), places:defaultPlaces() }), { _changed:true });
    var changed = c._changed; S._conv = c._convert || null; delete c._changed; delete c._convert; c.v = 7;
    return idbPut('kv', c, 'config').then(function(){ applyConfig(c); return changed && cfg ? enqueue({ t:'config', id:'config' }) : null; });
  }).then(function(){ return idbAll('entries'); }).then(function(list){
    var norm = list.map(normEntry), fix = [], conv = S._conv, convIds = [];
    S._conv = null;
    norm.forEach(function(e, i){
      var moved = conv && convertOne(e, conv);
      if (moved) convIds.push(e.id);
      if (moved || !list[i].tracker) fix.push(idbPut('entries', e));
    });
    if (convIds.length) fix.push(enqueueBulk(convIds.map(function(id){ return { t:'entry', id:id, photos:[] }; })));
    rebuildEntries(norm);
    return Promise.all(fix);
  }).then(function(){
    S.mode = 'ready'; S.loadedConfig = true; S.loadedDays = true; S.logSig = '';
    render();
    return refreshPending();
  }).then(function(){
    if (!META.endpoint){ if (!lsGet('setupSeen', false)) openConnSheet(true); return runRetention(); }
    return syncNow(true).then(runRetention);
  }).catch(function(){
    S.mode = 'error'; S.loadedConfig = true; S.loadedDays = true; render();
  });
}

applyTheme(lsGet('theme', 'auto'));
render();
bootApp();

window.addEventListener('online', function(){ paintSync(); syncNow(false); });
window.addEventListener('offline', paintSync);
document.addEventListener('visibilitychange', function(){ if (!document.hidden){ paintSync(); syncNow(false); if (S.tab === 'hoy') renderHoy(); } });
$('#syncPill').onclick = function(){ if (!META.endpoint) openConnSheet(false); else syncNow(true); };
if (typeof navigator !== 'undefined' && navigator.serviceWorker){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}

/* ============ hoja de conexión ============ */
function openConnSheet(first){
  var h = '<h2>' + (first ? 'Conectar con tu Google' : 'Conexión') + '</h2>' +
    '<p class="muted" style="margin:0 0 14px;font-size:.88rem">Pega la dirección de tu aplicación de Apps Script y la clave que pusiste en el código. Se guardan solo en este móvil; la página publicada no las contiene.</p>' +
    '<div class="field"><label for="cfEp">Dirección de la aplicación web</label>' +
    '<input type="url" id="cfEp" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(META.endpoint)+'"></div>' +
    '<div class="field"><label for="cfTk">Clave</label>' +
    '<input type="text" id="cfTk" autocomplete="off" value="'+esc(META.token)+'">' +
    '<p>La misma que escribiste en TOKEN dentro de Codigo.gs.</p></div>' +
    '<div class="sheet-actions"><button class="secondary" id="cfSkip">' + (first ? 'Ahora no' : 'Cancelar') + '</button>' +
    '<button class="primary" id="cfSave">Guardar y probar</button></div>';
  openSheet(h, function(){
    $('#cfSkip').onclick = function(){ lsSet('setupSeen', true); closeSheet(); };
    $('#cfSave').onclick = function(){
      var b = $('#cfSave');
      var ep = $('#cfEp').value.trim(), tk = $('#cfTk').value.trim();
      if (!ep || !tk){ toast('Rellena las dos casillas'); return; }
      if (!/^https:\/\/script\.google\.com\/.*\/exec$/.test(ep)){ toast('La dirección debe acabar en /exec'); return; }
      b.disabled = true; b.textContent = 'Probando…';
      var prev = { endpoint:META.endpoint, token:META.token };
      META.endpoint = ep; META.token = tk;
      api('ping').then(function(r){
        if (r && r.account) META.account = r.account;
        return saveMeta();
      }).then(function(){
        lsSet('setupSeen', true);
        closeSheet();
        toast(META.account ? 'Conectado a ' + META.account : 'Conectado');
        return syncNow(true).then(runRetention);
      }).catch(function(e){
        META.endpoint = prev.endpoint; META.token = prev.token;
        b.disabled = false; b.textContent = 'Guardar y probar';
        toast('No conecta: ' + (e && e.message ? e.message : 'revisa la dirección y la clave'));
      });
    };
  });
}


})();
