var PDF_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js';
var pdfLoading = null;
function loadJsPDF(){
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if (!pdfLoading){
    pdfLoading = new Promise(function(res, rej){
      var s = document.createElement('script');
      s.src = PDF_SRC;
      s.onload = function(){
        if (window.jspdf && window.jspdf.jsPDF) res(window.jspdf.jsPDF);
        else { pdfLoading = null; rej(new Error('cdn')); }
      };
      s.onerror = function(){ pdfLoading = null; rej(new Error('cdn')); };
      document.head.appendChild(s);
    });
  }
  return pdfLoading;
}

var PC = {
  ink:[24,38,33], mid:[92,108,100], soft:[142,156,148], line:[214,222,208],
  urine:[201,138,14], stool:[124,84,51], other:[74,107,138], brand:[15,110,98], tryc:[163,47,73],
  panel:[243,246,240], zebra:[250,251,248], warn:[168,62,38]
};
function tc(d,c){ d.setTextColor(c[0],c[1],c[2]); }
function fc(d,c){ d.setFillColor(c[0],c[1],c[2]); }
function dc(d,c){ d.setDrawColor(c[0],c[1],c[2]); }

var PDF_DEF = { period:30, from:'', to:'', kpis:true, obs:true, daily:true, hours:true,
                places:true, tags:true, week:false, table:true, notes:true, photos:false };
function pdfOpts(){ return Object.assign({}, PDF_DEF, lsGet('pdfOpts', {})); }
function shortDate(k){ var p = k.split('-'); return (+p[2]) + ' ' + MON[+p[1]-1]; }
function longDate(k){ var p = k.split('-'); return (+p[2]) + ' ' + MON[+p[1]-1] + ' ' + p[0]; }

function pdfRange(o){
  if (o.period === -1 && o.from && o.to){
    var a = o.from <= o.to ? o.from : o.to, b = o.from <= o.to ? o.to : o.from;
    var n = Math.min(800, Math.max(1, daysBetween(a, b) + 1));
    var p = a.split('-'), d0 = new Date(+p[0], +p[1]-1, +p[2]), out = [];
    for (var i=0;i<n;i++){ var x = new Date(d0); x.setDate(d0.getDate()+i); out.push(dayKey(x)); }
    return { keys:out, label:'Del ' + longDate(a) + ' al ' + longDate(b), span:n };
  }
  if (o.period === 0){
    var sorted = Array.from(S.days.keys()).sort();
    var first = sorted[0] || dayKey(new Date());
    var span = Math.min(800, Math.max(1, daysBetween(first, dayKey(new Date())) + 1));
    return { keys:rangeKeys(span), label:'Historial completo', span:span };
  }
  return { keys:rangeKeys(o.period), label:'Últimos ' + o.period + ' días', span:o.period };
}

function loadPhoto(key){
  return resolveThumb(key).then(function(url){
    if (!url) return null;
    return new Promise(function(res){
      var img = new Image();
      img.onload = function(){
        try {
          var c = document.createElement('canvas');
          c.width = img.naturalWidth; c.height = img.naturalHeight;
          c.getContext('2d').drawImage(img, 0, 0);
          res({ data:c.toDataURL('image/jpeg', 0.8), w:c.width, h:c.height });
        } catch(e){ res(null); }
      };
      img.onerror = function(){ res(null); };
      img.src = url;
    });
  }).catch(function(){ return null; });
}

function buildPdf(o){
  return loadJsPDF().then(function(JsPDF){
    var R = pdfRange(o), rows = [];
    R.keys.forEach(function(k){
      var d = S.days.get(k);
      if (d) (d.items||[]).forEach(function(it){ rows.push({ it:it, key:k }); });
    });
    rows.sort(function(a,b){ return a.it.ts < b.it.ts ? -1 : 1; });
    var shots = [];
    if (o.photos) rows.forEach(function(x){ if (thumbKey(x.it)) shots.push(x); });
    shots = shots.slice(0, 36);
    var ids = shots.map(function(x){ return thumbKey(x.it); });
    var pre = ids.length ? Promise.all(ids.map(loadPhoto)) : Promise.resolve([]);
    return pre.then(function(imgs){ return paintPdf(JsPDF, o, R, rows, shots, imgs); });
  });
}

function paintPdf(JsPDF, o, R, rows, shots, imgs){
  var doc = new JsPDF({ unit:'mm', format:'a4' });
  var PW = 210, PH = 297, M = 14, CW = PW - 2*M, y = M;
  var name = (S.app.catName || '').trim();

  function need(h){ if (y + h > PH - M - 8){ doc.addPage(); y = M; } }
  function h2(t, sub){
    need(14);
    doc.setFont('helvetica','bold'); doc.setFontSize(11); tc(doc, PC.ink);
    doc.text(t, M, y + 4);
    if (sub){ doc.setFont('helvetica','normal'); doc.setFontSize(8); tc(doc, PC.soft); doc.text(sub, PW-M, y+4, {align:'right'}); }
    y += 6.5;
    dc(doc, PC.line); doc.setLineWidth(0.3); doc.line(M, y, PW-M, y);
    y += 5.5;
  }
  function legend(pairs){
    need(8);
    var x = M;
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    pairs.forEach(function(p){
      fc(doc, p[1]); doc.roundedRect(x, y-2.2, 2.6, 2.6, 0.7, 0.7, 'F');
      tc(doc, PC.mid); doc.text(p[0], x+4, y);
      x += 4 + doc.getTextWidth(p[0]) + 7;
    });
    y += 6;
  }

  // header
  doc.setFont('helvetica','bold'); doc.setFontSize(17); tc(doc, PC.ink);
  doc.text(name ? ('Arenero de ' + name) : 'Diario del arenero', M, y + 6);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); tc(doc, PC.mid);
  doc.text(R.label + '  ·  ' + rows.length + (rows.length === 1 ? ' visita' : ' visitas'), M, y + 12);
  var now = new Date();
  tc(doc, PC.soft);
  doc.text(longDate(dayKey(now)) + ', ' + hhmm(now), PW-M, y + 12, { align:'right' });
  y += 16;
  dc(doc, PC.line); doc.setLineWidth(0.4); doc.line(M, y, PW-M, y); y += 8;

  if (!rows.length){
    doc.setFont('helvetica','normal'); doc.setFontSize(10); tc(doc, PC.mid);
    doc.text('No hay registros en este periodo.', M, y + 4);
    stampFooters();
    return doc;
  }

  var items = rows.map(function(x){ return x.it; });

  if (o.kpis){
    var c = summarise(items), sp = R.span;
    if (c.intento) doc.setProperties && doc.setProperties({ subject:'Intentos sin resultado: ' + c.intento });
    var boxes = [
      [String(rows.length), 'visitas', PC.ink],
      [(rows.length/sp).toFixed(1).replace('.',','), 'visitas al día', PC.ink],
      [((c.orina||0)/sp).toFixed(1).replace('.',','), 'pipís al día', PC.urine],
      [((c.caca||0)/sp).toFixed(1).replace('.',','), 'cacas al día', PC.stool]
    ];
    need(26);
    var bw = (CW - 3*3)/4;
    boxes.forEach(function(b, i){
      var x = M + i*(bw+3);
      fc(doc, PC.panel); dc(doc, PC.line); doc.setLineWidth(0.3);
      doc.roundedRect(x, y, bw, 20, 2, 2, 'FD');
      doc.setFont('helvetica','bold'); doc.setFontSize(15); tc(doc, b[2]);
      doc.text(b[0], x + bw/2, y + 9.5, { align:'center' });
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); tc(doc, PC.soft);
      doc.text(b[1], x + bw/2, y + 15.5, { align:'center' });
    });
    y += 27;
  }

  if (o.obs){
    var lines = obsLines(allEntries());
    if (lines.length){
      h2('Observaciones');
      lines.forEach(function(l){
        doc.setFont('helvetica','normal'); doc.setFontSize(9);
        var txt = doc.splitTextToSize(l.t, CW - 8);
        need(txt.length*4.2 + 4);
        fc(doc, l.warn ? PC.warn : PC.brand);
        doc.circle(M + 1.6, y + 1.6, 1, 'F');
        tc(doc, l.warn ? PC.warn : PC.ink);
        doc.text(txt, M + 5.5, y + 2.6);
        y += txt.length*4.2 + 2.5;
      });
      doc.setFontSize(7.5); tc(doc, PC.soft);
      var dis = doc.splitTextToSize('Observaciones calculadas a partir de los registros; no son un diagnóstico.', CW);
      need(dis.length*3.4 + 4);
      doc.text(dis, M, y + 2.6);
      y += dis.length*3.4 + 6;
    }
  }

  if (o.daily){
    var barKeys = R.keys.length > 92 ? R.keys.slice(-92) : R.keys;
    h2('Visitas por día', barKeys.length + ' días');
    need(40);
    var H = 30, n = barKeys.length;
    var data = barKeys.map(function(k){
      var d = S.days.get(k);
      var cc = d ? summarise(d.items||[]) : { orina:0, caca:0, intento:0, otro:0 };
      return { k:k, o:cc.orina||0, c:cc.caca||0, t:cc.intento||0, x:cc.otro||0 };
    });
    var max = 1; data.forEach(function(r){ max = Math.max(max, r.o + r.c + r.t + r.x); });
    var gap = n > 40 ? 0.3 : (n > 20 ? 0.7 : 1.6);
    var bw2 = (CW - gap*(n-1))/n;
    doc.setFont('helvetica','normal'); doc.setFontSize(6.5); tc(doc, PC.soft);
    doc.text('máx ' + max, M, y - 0.5);
    dc(doc, PC.line); doc.setLineWidth(0.3); doc.line(M, y + H, PW-M, y + H);
    data.forEach(function(r, i){
      var bx = M + i*(bw2+gap), by = y + H;
      [[r.x, PC.other], [r.t, PC.tryc], [r.o, PC.urine], [r.c, PC.stool]].forEach(function(s){
        if (!s[0]) return;
        var hh = (s[0]/max)*H;
        by -= hh; fc(doc, s[1]); doc.rect(bx, by, bw2, hh, 'F');
      });
    });
    tc(doc, PC.soft); doc.setFontSize(6.5);
    var step = Math.max(1, Math.ceil(n/9));
    data.forEach(function(r, i){
      if (i % step !== 0 && i !== n-1) return;
      doc.text(shortDate(r.k), M + i*(bw2+gap) + bw2/2, y + H + 3.4, { align:'center' });
    });
    y += H + 7;
    legend([['Pipí', PC.urine], ['Caca', PC.stool], ['Intentos', PC.tryc], ['Otros', PC.other]]);
  }

  if (o.hours){
    h2('Franjas horarias');
    need(32);
    var hrs = new Array(24).fill(0);
    items.forEach(function(it){ hrs[new Date(it.ts).getHours()]++; });
    var hmax = Math.max(1, Math.max.apply(null, hrs));
    var HH = 22, g2 = 1.1, bw3 = (CW - g2*23)/24;
    dc(doc, PC.line); doc.setLineWidth(0.3); doc.line(M, y + HH, PW-M, y + HH);
    for (var i=0;i<24;i++){
      var hh2 = (hrs[i]/hmax)*HH, bx2 = M + i*(bw3+g2);
      fc(doc, hrs[i] ? PC.brand : PC.panel);
      doc.rect(bx2, y + HH - Math.max(hh2, 0.4), bw3, Math.max(hh2, 0.4), 'F');
      if (i % 3 === 0){
        doc.setFont('helvetica','normal'); doc.setFontSize(6.5); tc(doc, PC.soft);
        doc.text(pad(i), bx2 + bw3/2, y + HH + 3.4, { align:'center' });
      }
    }
    y += HH + 9;
  }

  function hbarBlock(list, total, color){
    var max = Math.max.apply(null, list.map(function(r){ return r.n; })) || 1;
    list.forEach(function(r){
      need(7);
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); tc(doc, PC.ink);
      doc.text(String(r.label).slice(0, 24), M, y + 2.6);
      var tx = M + 44, tw = CW - 44 - 24;
      fc(doc, PC.panel); doc.roundedRect(tx, y, tw, 3.2, 1.6, 1.6, 'F');
      fc(doc, r.color || color || PC.brand);
      doc.roundedRect(tx, y, Math.max(1, tw*(r.n/max)), 3.2, 1.6, 1.6, 'F');
      doc.setFontSize(7.5); tc(doc, PC.soft);
      doc.text(r.n + ' · ' + (total ? Math.round(r.n*100/total) : 0) + '%', PW-M, y + 2.6, { align:'right' });
      y += 6.2;
    });
    y += 3;
  }

  if (o.places){
    var byPlace = {};
    items.forEach(function(it){ var k = it.place || '_'; byPlace[k] = (byPlace[k]||0) + 1; });
    var pl = activePlaces().map(function(p){ return { label:p.label, n:byPlace[p.id]||0 }; });
    if (byPlace['_']) pl.push({ label:'Sin ubicación', n:byPlace['_'] });
    pl.sort(function(a,b){ return b.n - a.n; });
    if (pl.length){ h2('Reparto por arenero'); hbarBlock(pl, rows.length, PC.brand); }
  }

  if (o.tags){
    var byTag = {};
    items.forEach(function(it){ Object.keys(it.tags||{}).forEach(function(id){ byTag[id] = (byTag[id]||0) + (it.tags[id]||1); }); });
    var tot = Object.keys(byTag).reduce(function(a,k){ return a + byTag[k]; }, 0);
    var tg = activeTags().map(function(t){
      return { label:t.label, n:byTag[t.id]||0,
               color: t.kind === 'orina' ? PC.urine : (t.kind === 'caca' ? PC.stool : (t.kind === 'intento' ? PC.tryc : PC.other)) };
    }).filter(function(x){ return x.n > 0; });
    tg.sort(function(a,b){ return b.n - a.n; });
    if (tg.length){ h2('Cantidades por etiqueta'); hbarBlock(tg, tot); }
  }

  if (o.week){
    h2('Media por día de la semana');
    need(32);
    var sum = [0,0,0,0,0,0,0], cnt = [0,0,0,0,0,0,0];
    R.keys.forEach(function(k){
      var p = k.split('-'), dd = new Date(+p[0], +p[1]-1, +p[2]), w = dd.getDay(), day = S.days.get(k);
      sum[w] += day ? (day.items||[]).length : 0; cnt[w]++;
    });
    var avg = sum.map(function(s2, i){ return cnt[i] ? s2/cnt[i] : 0; });
    var wmax = Math.max(0.5, Math.max.apply(null, avg));
    var order = [1,2,3,4,5,6,0], WH = 22, g3 = 5, bw4 = (CW - g3*6)/7;
    dc(doc, PC.line); doc.setLineWidth(0.3); doc.line(M, y + WH, PW-M, y + WH);
    order.forEach(function(w, i){
      var hh3 = (avg[w]/wmax)*WH, bx3 = M + i*(bw4+g3);
      fc(doc, PC.brand);
      doc.roundedRect(bx3, y + WH - Math.max(hh3, 0.6), bw4, Math.max(hh3, 0.6), 1, 1, 'F');
      doc.setFont('helvetica','normal'); doc.setFontSize(7); tc(doc, PC.soft);
      doc.text(DOW_S[w], bx3 + bw4/2, y + WH + 3.6, { align:'center' });
      if (avg[w] > 0) doc.text(avg[w].toFixed(1).replace('.',','), bx3 + bw4/2, y + WH - hh3 - 1.4, { align:'center' });
    });
    y += WH + 9;
  }

  if (o.table){
    h2('Registros', rows.length + (rows.length === 1 ? ' visita' : ' visitas'));
    var cols = o.notes ? [20,12,56,26,68] : [24,14,82,62];
    var heads = o.notes ? ['Fecha','Hora','Etiquetas','Arenero','Nota'] : ['Fecha','Hora','Etiquetas','Arenero'];
    var drawHead = function(){
      fc(doc, PC.panel); doc.rect(M, y, CW, 6.6, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(7.8); tc(doc, PC.mid);
      var cx = M + 2;
      heads.forEach(function(hd, i){ doc.text(hd, cx, y + 4.4); cx += cols[i]; });
      y += 6.6;
    };
    need(22); drawHead();
    rows.forEach(function(x, idx){
      var it = x.it, d = new Date(it.ts), labels = [];
      Object.keys(it.tags||{}).forEach(function(id){
        var t = tagById(id), nn = it.tags[id] || 1;
        labels.push((t ? t.label : 'borrada') + (nn > 1 ? ' x' + nn : ''));
      });
      var pl2 = it.place ? placeById(it.place) : null;
      var cells = [shortDate(x.key), hhmm(d), labels.join(', '), pl2 ? pl2.label : '—'];
      if (o.notes) cells.push(it.note || '');
      doc.setFont('helvetica','normal'); doc.setFontSize(7.8);
      var wrapped = cells.map(function(txt, i){ return doc.splitTextToSize(String(txt), cols[i] - 3); });
      var lineN = Math.max.apply(null, wrapped.map(function(l){ return l.length; }));
      var rh = lineN*3.5 + 2.8;
      if (y + rh > PH - M - 8){ doc.addPage(); y = M; drawHead(); doc.setFont('helvetica','normal'); doc.setFontSize(7.8); }
      if (idx % 2 === 1){ fc(doc, PC.zebra); doc.rect(M, y, CW, rh, 'F'); }
      var cx2 = M + 2;
      wrapped.forEach(function(l, i){
        tc(doc, i >= 2 ? PC.mid : PC.ink);
        doc.text(l, cx2, y + 3.7);
        cx2 += cols[i];
      });
      dc(doc, PC.line); doc.setLineWidth(0.15); doc.line(M, y + rh, PW-M, y + rh);
      y += rh;
    });
    y += 7;
  }

  if (o.photos && shots.length){
    var ok = imgs.filter(function(im){ return !!im; }).length;
    if (ok){
      h2('Fotos', shots.length + (shots.length === 1 ? ' foto' : ' fotos'));
      var cw = (CW - 4*2)/3, ch = cw*0.72, col = 0;
      shots.forEach(function(x, i){
        var im = imgs[i];
        if (!im) return;
        if (col === 0) need(ch + 10);
        var px = M + col*(cw + 4);
        try {
          var ar = im.w/im.h, dw = cw, dh = cw/ar;
          if (dh > ch){ dh = ch; dw = ch*ar; }
          doc.addImage(im.data, 'JPEG', px + (cw - dw)/2, y, dw, dh);
        } catch(e){}
        doc.setFont('helvetica','normal'); doc.setFontSize(6.8); tc(doc, PC.soft);
        doc.text(shortDate(x.key) + '  ' + hhmm(new Date(x.it.ts)), px + cw/2, y + ch + 3.4, { align:'center' });
        col++;
        if (col === 3){ col = 0; y += ch + 7.5; }
      });
      if (col !== 0) y += ch + 7.5;
    }
  }

  stampFooters();
  return doc;

  function stampFooters(){
    var total = doc.internal.getNumberOfPages();
    for (var p = 1; p <= total; p++){
      doc.setPage(p);
      doc.setFont('helvetica','normal'); doc.setFontSize(7); tc(doc, PC.soft);
      doc.text('Diario del arenero' + (name ? ' · ' + name : ''), M, PH - 8);
      doc.text(p + ' / ' + total, PW - M, PH - 8, { align:'right' });
    }
  }
}

function exportPdf(o){
  lsSet('pdfOpts', o);
  toast('Preparando el PDF…');
  buildPdf(o).then(function(doc){
    doc.save('arenero-' + dayKey(new Date()) + '.pdf');
    toast('PDF descargado');
  }).catch(function(e){
    toast(e && e.message === 'cdn' ? 'No se pudo cargar el generador de PDF' : 'No se pudo crear el PDF');
  });
}

function openPdfSheet(preset){
  var o = pdfOpts();
  if (typeof preset === 'number') o.period = preset;
  var periods = [[7,'7 d'],[30,'30 d'],[90,'90 d'],[0,'Todo'],[-1,'Fechas']];
  var checks = [
    ['kpis','Resumen y medias'],
    ['obs','Observaciones'],
    ['daily','Gráfico de visitas por día'],
    ['hours','Gráfico de franjas horarias'],
    ['places','Reparto por arenero'],
    ['tags','Cantidades por etiqueta'],
    ['week','Media por día de la semana'],
    ['table','Tabla con todos los registros']
  ];
  var today = dayKey(new Date());
  var h = '<h2>Exportar a PDF</h2>';
  h += '<div class="group-label" style="margin-top:2px"><b>Periodo</b></div><div class="segment">' +
    periods.map(function(p){
      return '<button data-pp="'+p[0]+'" aria-pressed="'+(o.period===p[0])+'" style="font-size:.8rem;padding:10px 2px">'+p[1]+'</button>';
    }).join('') + '</div>' +
    '<div class="daterange" id="pRange" style="display:'+(o.period===-1?'flex':'none')+'">' +
    '<input type="date" id="pFrom" max="'+today+'" value="'+esc(o.from)+'" aria-label="Desde">' +
    '<input type="date" id="pTo" max="'+today+'" value="'+esc(o.to)+'" aria-label="Hasta"></div>';

  h += '<div class="group-label" style="margin-top:16px"><b>Qué incluir</b></div>';
  checks.forEach(function(c){
    h += '<label class="check"><input type="checkbox" data-ck="'+c[0]+'"'+(o[c[0]]?' checked':'')+'><span>'+c[1]+'</span></label>';
  });
  h += '<label class="check sub"><input type="checkbox" data-ck="notes"'+(o.notes?' checked':'')+'><span>Incluir la columna de notas</span></label>';
  h += '<label class="check"><input type="checkbox" data-ck="photos"'+(o.photos?' checked':'')+'><span>Incluir las fotos (máx. 36)</span></label>';
  h += '<div class="sheet-actions"><button class="secondary" id="pCancel">Cancelar</button><button class="primary" id="pGo">Crear PDF</button></div>';

  openSheet(h, function(sh){
    sh.querySelectorAll('[data-pp]').forEach(function(b){
      b.onclick = function(){
        o.period = +b.dataset.pp;
        sh.querySelectorAll('[data-pp]').forEach(function(x){ x.setAttribute('aria-pressed', (+x.dataset.pp === o.period) ? 'true':'false'); });
        $('#pRange').style.display = o.period === -1 ? 'flex' : 'none';
      };
    });
    sh.querySelectorAll('[data-ck]').forEach(function(inp){
      inp.onchange = function(){ o[inp.dataset.ck] = inp.checked; };
    });
    $('#pCancel').onclick = closeSheet;
    $('#pGo').onclick = function(){
      o.from = $('#pFrom').value; o.to = $('#pTo').value;
      if (o.period === -1 && (!o.from || !o.to)){ toast('Elige las dos fechas'); return; }
      closeSheet();
      exportPdf(o);
    };
  });
}

/* ============ theme ============ */
function applyTheme(t){
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
applyTheme(lsGet('theme','auto'));

/* ============ nav ============ */
document.querySelectorAll('nav.tabs button').forEach(function(b){
  b.onclick = function(){ S.tab = b.dataset.tab; window.scrollTo(0,0); render(); };
});
$('#btnSettings').onclick = function(){
  S.tab = S.tab === 'set' ? 'log' : 'set';
  window.scrollTo(0,0); render();
};

/* ============ hoja de conexión ============ */
function openConnSheet(first){
  var h = '<h2>' + (first ? 'Conectar con tu Google' : 'Conexión') + '</h2>' +
    '<p class="muted" style="margin:0 0 14px;font-size:.88rem">Pega la dirección de tu aplicación de Apps Script y la clave que pusiste en el código. Se guardan solo en este móvil; la página publicada no las contiene.</p>' +
    '<div class="field"><label for="cfEp">Dirección de la aplicación web</label>' +
    '<input type="url" id="cfEp" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(META.endpoint)+'"></div>' +
    '<div class="field"><label for="cfTk">Clave</label>' +
    '<input type="text" id="cfTk" autocomplete="off" value="'+esc(META.token)+'">' +
    '<p>La misma que escribiste en TOKEN dentro de Codigo.gs.</p></div>' +
    '<div class="sheet-actions"><button class="secondary" id="cfSkip">' + (first ? 'Ahora no' : 'Cancelar') + '</button>' +
    '<button class="primary" id="cfSave">Guardar y probar</button></div>';
  openSheet(h, function(){
    $('#cfSkip').onclick = function(){ lsSet('setupSeen', true); closeSheet(); };
    $('#cfSave').onclick = function(){
      var b = $('#cfSave');
      var ep = $('#cfEp').value.trim(), tk = $('#cfTk').value.trim();
      if (!ep || !tk){ toast('Rellena las dos casillas'); return; }
      if (!/^https:\/\/script\.google\.com\/.*\/exec$/.test(ep)){ toast('La dirección debe acabar en /exec'); return; }
      b.disabled = true; b.textContent = 'Probando…';
      var prev = { endpoint:META.endpoint, token:META.token };
      META.endpoint = ep; META.token = tk;
      api('ping').then(function(){
        return saveMeta();
      }).then(function(){
        lsSet('setupSeen', true);
        closeSheet();
        toast('Conectado');
        return syncNow(true).then(runRetention);
      }).catch(function(e){
        META.endpoint = prev.endpoint; META.token = prev.token;
        b.disabled = false; b.textContent = 'Guardar y probar';
        toast('No conecta: ' + (e && e.message ? e.message : 'revisa la dirección y la clave'));
      });
    };
  });
}

/* ============ arranque ============ */
function bootApp(){
  return loadMeta().then(function(){
    return idbGet('kv','config');
  }).then(function(cfg){
    if (cfg && Array.isArray(cfg.tags) && cfg.tags.length) return cfg;
    var fresh = normConfig({ tags:defaultTags(), places:defaultPlaces() });
    return idbPut('kv', fresh, 'config').then(function(){ return fresh; });
  }).then(function(cfg){
    applyConfig(cfg);
    return idbAll('entries');
  }).then(function(list){
    rebuildDays(list);
    S.mode = 'ready'; S.loadedConfig = true; S.loadedDays = true; S.logSig = '';
    render();
    return refreshPending();
  }).then(function(){
    if (!META.endpoint){
      if (!lsGet('setupSeen', false)) openConnSheet(true);
      return null;
    }
    return syncNow(true).then(runRetention);
  }).catch(function(){
    S.mode = 'error'; S.loadedConfig = true; S.loadedDays = true;
    render();
  });
}

render();
bootApp();

window.addEventListener('online',  function(){ paintSync(); syncNow(false); });
window.addEventListener('offline', paintSync);
document.addEventListener('visibilitychange', function(){
  if (!document.hidden){ paintSync(); syncNow(false); }
});
if ($('#syncPill')) $('#syncPill').onclick = function(){
  if (!META.endpoint) openConnSheet(false); else syncNow(true);
};
if (typeof navigator !== 'undefined' && navigator.serviceWorker){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}

})();
</script>
